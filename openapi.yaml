openapi: 3.0.3
info:
  title: Torah Trainer Backend API
  version: 1.0.0
  description: API contract for audio upload/processing, segment management, and queue tracking.
servers:
  - url: http://localhost:3000
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /api/audio/scan:
    get:
      summary: Scan mounted audio storage and return matching audio segments
      parameters:
        - in: query
          name: nusach
          schema:
            type: string
            example: '01'
        - in: query
          name: bookId
          schema:
            type: string
            example: '01'
        - in: query
          name: chapter
          schema:
            type: string
            example: '03'
        - in: query
          name: verse
          schema:
            type: string
            example: '12'
      responses:
        '200':
          description: Matching audio segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioScanResponse'
  /api/audio/segments/{nusach}/{bookId}/{chapter}/{verse}:
    get:
      summary: Get all audio segment files for a specific verse
      parameters:
        - $ref: '#/components/parameters/NusachPath'
        - $ref: '#/components/parameters/BookIdPath'
        - $ref: '#/components/parameters/ChapterPath'
        - $ref: '#/components/parameters/VersePath'
      responses:
        '200':
          description: Segment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudioScanResponse'
  /api/uploads/audio:
    post:
      summary: Upload a prerecorded audio file using multipart/form-data and queue processing
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [nusach, bookId, chapter, verse, partIndex, file]
              properties:
                nusach:
                  type: string
                  example: '01'
                bookId:
                  type: string
                  example: '01'
                chapter:
                  type: string
                  example: '05'
                verse:
                  type: string
                  example: '08'
                partIndex:
                  type: string
                  example: '02'
                file:
                  type: string
                  format: binary
      responses:
        '202':
          description: Accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueAcceptedResponse'
        '400':
          description: Validation error
  /api/uploads/audio/blob:
    post:
      summary: Upload browser MediaRecorder data (base64 in JSON) and queue processing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nusach, bookId, chapter, verse, partIndex, audioBase64]
              properties:
                nusach:
                  type: string
                bookId:
                  type: string
                chapter:
                  type: string
                verse:
                  type: string
                partIndex:
                  type: string
                fileName:
                  type: string
                  example: recording.webm
                mimeType:
                  type: string
                  example: audio/webm
                audioBase64:
                  type: string
                  description: Base64 encoded audio payload
      responses:
        '202':
          description: Accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueAcceptedResponse'
        '400':
          description: Validation error
  /api/audio/segments/replace:
    post:
      summary: Replace all verse segments with a new segmentation set using naming convention AA-BB-CC-DD-EE.ext
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nusach, bookId, chapter, verse, segments]
              properties:
                nusach:
                  type: string
                bookId:
                  type: string
                chapter:
                  type: string
                verse:
                  type: string
                segments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [partIndex, audioBase64]
                    properties:
                      partIndex:
                        type: string
                        example: '01'
                      fileName:
                        type: string
                        example: verse-part-1.wav
                      mimeType:
                        type: string
                        example: audio/wav
                      audioBase64:
                        type: string
      responses:
        '202':
          description: Accepted and queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueAcceptedResponse'
        '400':
          description: Validation error
  /api/uploads/jobs/{jobId}:
    get:
      summary: Fetch status/result for background upload or replacement job
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Job details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueJobResponse'
        '404':
          description: Job not found
components:
  parameters:
    NusachPath:
      in: path
      name: nusach
      required: true
      schema:
        type: string
        example: '01'
    BookIdPath:
      in: path
      name: bookId
      required: true
      schema:
        type: string
        example: '01'
    ChapterPath:
      in: path
      name: chapter
      required: true
      schema:
        type: string
        example: '03'
    VersePath:
      in: path
      name: verse
      required: true
      schema:
        type: string
        example: '12'
  schemas:
    AudioSegment:
      type: object
      properties:
        nusach:
          type: string
        bookId:
          type: string
        chapter:
          type: string
        verse:
          type: string
        partIndex:
          type: string
        extension:
          type: string
        fileName:
          type: string
        absolutePath:
          type: string
    AudioScanResponse:
      type: object
      properties:
        count:
          type: integer
        segments:
          type: array
          items:
            $ref: '#/components/schemas/AudioSegment'
    QueueAcceptedResponse:
      type: object
      properties:
        jobId:
          type: string
          format: uuid
        status:
          type: string
          enum: [queued, processing, completed, failed]
    QueueJobResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [uploadSegment, replaceVerseSegments]
        status:
          type: string
          enum: [queued, processing, completed, failed]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        result:
          type: object
          nullable: true
        error:
          type: string
          nullable: true
